// =====================================================================
// Claudia - configuración del plugin (se ejecuta al cargar el mapa)
// =====================================================================

// Dónde escucha el servicio de Claudia (service/config/service.json -> plugin).
claudia_host "127.0.0.1"
claudia_port "27100"

// Tiene que ser IGUAL a "secret" en service/config/service.json.
claudia_secret "CAMBIAR-ESTE-SECRETO"

// Segundos para identificarse (/login o /registrar) antes de ser expulsado. 0 = no expulsar.
claudia_login_timeout "30"

// Flags de owner/staff: ven el perfil completo de cualquier usuario (memoria, préstamos, IP...).
claudia_staff_flags "l"

// Flags para amx_darcoins, amx_quitarcoins y amx_claudia_reload.
claudia_admin_flags "l"
