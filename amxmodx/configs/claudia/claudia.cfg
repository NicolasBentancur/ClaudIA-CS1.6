// =====================================================================
// Claudia - configuración del plugin (se ejecuta al cargar el mapa)
// =====================================================================

// Dónde escucha el servicio de Claudia (service/config/service.json -> plugin).
claudia_host "127.0.0.1"
claudia_port "27100"

// Tiene que ser IGUAL a "secret" en service/config/service.json.
claudia_secret "CAMBIAR-ESTE-SECRETO"

// Segundos para identificarse (/login o /registrar) antes de ser expulsado. 0 = no expulsar.
claudia_login_timeout "30"

// Roles: jugador < admin < staff < owner. Cada rol tiene todo lo del anterior.
// Alcanza con tener UNA de las flags de la lista (users.ini de AMX Mod X); se usa el rol más alto.
// Qué puede hacer cada rol se configura en service/config/roles.json. La consola del servidor es owner.
// admin: "d" = ADMIN_BAN | staff: "m" = ADMIN_LEVEL_A | owner: "l" = ADMIN_RCON
claudia_admin_flags "d"
claudia_staff_flags "m"
claudia_owner_flags "l"
