// Servidor público (claudia_publico.amxx). Se ejecuta al cargar cada mapa.

// Rondas: tiempos competitivos, salvo el freezetime que es 0.
mp_freezetime 0
mp_roundtime 1.75
mp_c4timer 35
mp_buytime 0.25
mp_startmoney 800

// Mapa: por tiempo (la votación arranca 3 minutos antes del final).
mp_timelimit 30
mp_maxrounds 0
mp_winlimit 0

// Público
mp_friendlyfire 0
mp_autoteambalance 1
mp_limitteams 2
mp_flashlight 1
mp_footsteps 1
mp_autokick 0
mp_tkpunish 0
sv_alltalk 1              // terroristas y anti se escuchan por el chat de voz

// Calentamiento al empezar cada mapa (arranca cuando entra el primer jugador; 0 = sin calentamiento).
cp_warmup_time 60

// Loadouts: segundos que dura el menú al aparecer. El arma se cambia solo sin salir de la zona
// de compra (al que revivieron le quedan estos segundos para elegir).
cp_loadout_time 15

// Cartel de revivir sobre los compañeros muertos
cp_revive_scale 0.15     // tamaño del cartel
cp_revive_height 40      // altura sobre el piso donde quedó el cuerpo

// Votación de mapa
cp_vote_time 20          // segundos para votar
cp_vote_start 180        // segundos antes del final del mapa
cp_vote_maps 5           // mapas en la votación
cp_extend_minutes 15     // minutos que suma "Extender"
cp_extend_max 2          // veces que se puede extender
cp_rtv_ratio 0.6         // proporción de jugadores para rock the vote
cp_rtv_delay 120         // segundos desde que empieza el mapa para poder hacer rtv
cp_recent_maps 3         // mapas recientes que no se ofrecen (si hay suficientes)

// Avisos y sonidos
cp_plant_warn 20         // segundos restantes para avisar a los T que planten
cp_multikill_window 3.0  // segundos entre kills para double/multi kill...
cp_sounds 1
